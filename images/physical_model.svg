<text x="666" y="90" class="ct" text-anchor="start">Smart EM damper</text>
<text x="666" y="111" class="cs" text-anchor="start">replaces today's oil damper</text>
<text x="666" y="128" class="cs" text-anchor="start">2 per bogie · design C</text>
<text x="666" y="168" class="ch" text-anchor="start">How it is built</text>
<text x="666" y="190" class="cl" text-anchor="start">Ball screw + magnet</text>
<text x="666" y="210" class="cl" text-anchor="start">generator (G)</text>
<text x="666" y="238" class="ch" text-anchor="start">How it works</text>
<text x="666" y="260" class="cl" text-anchor="start">Speed → voltage</text>
<text x="666" y="280" class="cl" text-anchor="start">Current → force</text>
<text x="666" y="300" class="cl" text-anchor="start">So the current sets</text>
<text x="666" y="320" class="cl" text-anchor="start">the damping</text>
<text x="666" y="348" class="ch" text-anchor="start">What it gives</text>
<text x="666" y="370" class="cl" text-anchor="start">Damping 0–246 kN·s/m</text>
<text x="666" y="390" class="cl" text-anchor="start">Harvests 33–38 W</text>
<text x="666" y="410" class="cl" text-anchor="start">Fail-safe = today's</text>
<text x="666" y="430" class="cl" text-anchor="start">35 kN·s/m damper</text>
